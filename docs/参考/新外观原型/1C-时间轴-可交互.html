<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1C 时间轴 · 可交互原型 v2（新外观）</title>
<style>
/* 1C 时间轴 · 可交互原型 v2
   设计读法：单屏桌面小组件（360×640），每日高频使用，气质"安静的日程纸"。
   VARIANCE 4 / MOTION 3 / DENSITY 5：不做花活，优先手感与可读性。
   间距全部落在 4px 栅格；字号 10/11/13/28 四档；正文与标签对比度 >= AA。 */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  --accent:#4f7391;--accent-hover:#5f86a5;--accent-fg:#f7fafc;--accent-soft:rgba(79,115,145,.14);
  --text:#33383f;--muted:#5c636c;--faint:#676d76;
  --card:#f7f8f9;--card-border:rgba(30,35,42,.12);--row-hover:rgba(30,35,42,.05);
  --chip:rgba(30,35,42,.06);--line:rgba(30,35,42,.26);--overdue:#a83a34;--done-time:#5c636c;
  --radius-win:8px;--radius-row:6px;--win-shadow:0 6px 24px rgba(16,24,34,.18);
  font-family:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",sans-serif;
  font-size:13px;line-height:1.5;overflow:hidden;color:var(--text);
  background:
    radial-gradient(1180px 760px at 78% 12%, rgba(126,151,173,.12), transparent 62%),
    radial-gradient(920px 640px at 10% 88%, rgba(110,124,142,.10), transparent 60%),
    linear-gradient(160deg,#0d1116,#141a21 55%,#0d1116);
}
body[data-theme="night"]{
  --accent:#8fb0c9;--accent-hover:#a3c0d6;--accent-fg:#0e1418;--accent-soft:rgba(143,176,201,.18);
  --text:#dde2e8;--muted:#a8b0ba;--faint:#9099a3;
  --card:#1d2127;--card-border:rgba(255,255,255,.10);--row-hover:rgba(255,255,255,.06);
  --chip:rgba(255,255,255,.08);--line:rgba(255,255,255,.22);--overdue:#e08a83;--done-time:#a8b0ba;
  --win-shadow:0 6px 24px rgba(0,0,0,.45);
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.ic{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chk{stroke-width:2.2}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- 原型工具条（harness，不属于产品视觉） ---------- */
.pbar{position:fixed;top:0;left:0;right:0;height:38px;z-index:200;display:flex;align-items:center;gap:8px;
  padding:0 16px;background:rgba(13,17,22,.92);border-bottom:1px solid rgba(255,255,255,.08);
  font-size:12px;color:#cfd6e2}
.pbar .b{font-weight:600;color:#eef3fa;letter-spacing:.3px}
.pbar .sep{width:1px;height:16px;background:rgba(255,255,255,.14)}
.pbar button{height:26px;padding:0 10px;border-radius:6px;border:1px solid rgba(255,255,255,.16);
  background:transparent;color:#cfd6e2;font-size:11.5px;cursor:pointer;font-family:inherit}
.pbar button:hover{background:rgba(255,255,255,.08);color:#f5f7fa}
.pbar button:active{transform:translateY(1px)}
.pbar .hint{margin-left:auto;font-size:11px;color:rgba(255,255,255,.45);white-space:nowrap}

/* ---------- 桌面：主窗固定，模板窗向右展开不挤动主窗 ---------- */
.desk{position:absolute;inset:38px 0 0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.anchor{transition:transform .28s cubic-bezier(.22,.61,.36,1)}
.anchor.tucked{transform:translateY(-760px)}
.cluster{position:relative;display:flex;align-items:flex-start}
.win{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-win);
  box-shadow:var(--win-shadow);color:var(--text);display:flex;flex-direction:column;overflow:hidden}
.win.main{width:360px;height:640px}
.win.tpl{position:absolute;left:calc(100% + 4px);top:0;width:260px;height:auto;max-height:640px;display:none}
.win.tpl.open{display:flex}

/* 标题行 */
.head{display:flex;align-items:center;gap:8px;padding:12px 16px 4px;flex:none}
.tb{width:16px;height:16px;flex:none;border-radius:5px;background:var(--accent);color:var(--accent-fg);
  display:flex;align-items:center;justify-content:center}
.tb svg{width:11px;height:11px;stroke-width:2.4}
.head .brand{font-size:13px;font-weight:600;letter-spacing:.4px}
.wicons{margin-left:auto;display:flex;align-items:center;gap:2px}
.ib{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--faint);
  border-radius:6px;cursor:pointer;border:none;background:transparent;position:relative;
  transition:background .15s,color .15s}
.ib:hover{background:var(--row-hover);color:var(--text)}
.ib:active{transform:translateY(1px)}
.ib.on{color:var(--accent)}
.ib svg{width:14px;height:14px}

/* 时钟单独一块；动作（计数 / ⚡ / 批量删除 / 新建）整体落到时间下方 */
.clockzone{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 16px 14px;flex:none}
.actionzone{display:flex;align-items:center;gap:8px;padding:2px 16px 12px;flex:none}
.actionzone .spacer{flex:1}
.bigclock{font-size:28px;font-weight:500;letter-spacing:.4px;font-variant-numeric:tabular-nums;line-height:1.15}
.bigdate{font-size:11px;color:var(--faint);letter-spacing:.2px}
.sidebtn{width:28px;height:28px;border:1px solid var(--card-border);border-radius:6px;background:var(--card);
  display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;
  position:relative;transition:border-color .15s,color .15s,background .15s}
.sidebtn:hover{border-color:var(--line);color:var(--text);background:var(--row-hover)}
.sidebtn:active{transform:translateY(1px)}
.sidebtn.on{border-color:var(--accent);color:var(--accent)}
.sidebtn svg{width:14px;height:14px}
.cntchip{font-size:11px;color:var(--muted);background:var(--chip);border-radius:99px;
  padding:3px 9px;font-variant-numeric:tabular-nums;line-height:18px}
.cntchip.full{color:var(--accent);background:var(--accent-soft)}
.endbtns{display:flex;align-items:center;gap:8px}
.fdel{padding:5px 10px;border:1px solid var(--card-border);border-radius:6px;font-size:11px;
  color:var(--muted);display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:transparent;
  font-family:inherit;transition:background .15s,color .15s}
.fdel:hover{background:var(--row-hover);color:var(--text)}
.fdel:active{transform:translateY(1px)}
.fdel svg{width:13px;height:13px}
.fdel.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.addbtn{width:28px;height:28px;border-radius:6px;background:var(--accent);color:var(--accent-fg);
  display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;transition:background .15s}
.addbtn:hover{background:var(--accent-hover)}
.addbtn:active{transform:translateY(1px)}
.addbtn svg{width:15px;height:15px;stroke-width:2.2}

/* 批量条 */
.batchbar{display:none;align-items:center;gap:8px;padding:2px 16px 12px;flex:none}
.batchbar.on{display:flex}
.batchbar .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:18px}
.batchbar .sbtn{height:28px;line-height:26px}
.batchbar .sp{margin-left:auto}
.sbtn{padding:0 10px;border:1px solid var(--card-border);border-radius:6px;background:transparent;
  font-size:11px;color:var(--muted);cursor:pointer;font-family:inherit;transition:background .15s,color .15s}
.sbtn:hover{background:var(--row-hover);color:var(--text)}
.sbtn:active{transform:translateY(1px)}
.sbtn:disabled{opacity:.45;cursor:default;transform:none}
.sbtn.danger{color:var(--overdue);border-color:rgba(168,58,52,.4)}

/* ---------- 时间轴：轴 + 点（1C 的身份，必须保留） ---------- */
.tl{flex:1;min-height:0;overflow:auto;padding:0 16px 16px;position:relative}
.tl::-webkit-scrollbar{width:8px}
.tl::-webkit-scrollbar-thumb{background:var(--card-border);border-radius:99px}
.trow{display:flex;align-items:center;height:36px;border-radius:var(--radius-row);position:relative}
.trow:hover{background:var(--row-hover)}
.trow .tt{flex:none;width:34px;text-align:right;font-size:11px;color:var(--done-time);
  font-variant-numeric:tabular-nums;padding-right:8px}
.trow .grip{width:14px;flex:none;color:var(--faint);display:flex;align-items:center;justify-content:center;
  cursor:grab}
/* 已完成段＝带时间轴的时间流；待办段＝无轴清单 */
.doneblock{position:relative}
.doneblock::before{content:"";position:absolute;left:42px;top:52px;bottom:18px;width:1px;
  background:var(--card-border)}
.trow .node{flex:none;width:16px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.dot{width:7px;height:7px;border-radius:50%}
.dot.solid{background:var(--accent)}
.trow .grip:active{cursor:grabbing}
.trow .grip.disabled{cursor:not-allowed;opacity:.4}
.trow .grip.disabled:active{cursor:not-allowed}
.trow .grip svg{width:12px;height:12px}
/* 待办行无时间列：内容从左侧起（已完成行仍带 HH:mm 时间列） */
.trow .tx{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding:0 8px 0 6px}
.trow.done .tx{padding-left:9px}
.trow .tag{flex:none;font-size:11px;color:var(--overdue);padding-right:8px}
.cb{width:16px;height:16px;flex:none;border:1px solid var(--line);border-radius:4px;background:var(--card);
  display:flex;align-items:center;justify-content:center;color:transparent;cursor:pointer;
  position:relative;transition:border-color .15s,background .15s}
.cb::after{content:"";position:absolute;inset:-5px}
.cb:hover{border-color:var(--accent)}
.cb svg{width:12px;height:12px}
.cb.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.trow .cb.disabled{cursor:not-allowed;opacity:.4}
.trow .cb.disabled:hover{border-color:var(--line)}
.trow.done .tx{color:var(--muted)}
.trow.done .tt{color:var(--faint)}
/* 批量选中态：同一颗行尾勾选框变实心（选中）+ 行淡底 */
.trow.picked{background:var(--accent-soft)}
.trow.picked .cb{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.trow.picked .tx{color:var(--muted)}
.trow.flash{animation:flash .9s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.sect{display:flex;align-items:center;gap:8px;height:34px;margin-top:6px;position:relative;z-index:1}
.sect .t{font-size:10px;letter-spacing:1px;color:var(--faint);background:var(--card);padding-right:8px}
.sect .l{flex:1;height:1px;background:var(--card-border)}
.tl.dimdone .sect,.tl.dimdone .trow.done{opacity:.4;pointer-events:none}
.empty{padding:32px 0 8px;text-align:center}
.empty .a{font-size:13px;color:var(--muted)}
.empty .b{margin-top:8px;font-size:11px;color:var(--faint)}
.trow.dragging{opacity:.45}

/* ---------- 模板窗 ---------- */
.tplhead{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;flex:none}
.tplhead .brand{font-size:13px;font-weight:600;letter-spacing:.4px}
.tplhead .cnt{margin-left:auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.tplrows{flex:1;min-height:0;overflow:auto;padding:0 8px 8px}
.tplrow{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px;border-radius:var(--radius-row)}
.tplrow:hover{background:var(--row-hover)}
.tplrow .tx{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tplrow .plus{width:22px;height:22px;flex:none;border:none;background:transparent;color:var(--faint);
  border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tplrow .plus:hover{background:var(--accent-soft);color:var(--accent)}
.tplrow .plus svg{width:12px;height:12px;stroke-width:2.2}
.tplrow .sel{width:15px;height:15px;flex:none;border:1px solid var(--line);border-radius:4px;
  display:flex;align-items:center;justify-content:center;color:transparent;cursor:pointer}
.tplrow.picked{background:var(--accent-soft)}
.tplrow.picked .sel{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tplrow .sel svg{width:11px;height:11px}
.tplfoot{display:flex;align-items:center;gap:2px;padding:8px 10px 10px;border-top:1px solid var(--card-border);flex:none}
.ghost{font-size:11px;color:var(--muted);cursor:pointer;padding:5px 9px;border-radius:5px;border:none;
  background:transparent;font-family:inherit;transition:background .15s,color .15s}
.ghost:hover{background:var(--row-hover);color:var(--text)}
.ghost:active{transform:translateY(1px)}
.tplfoot .sp{margin-left:auto}

/* 收纳细线 */
.strip{position:absolute;top:0;left:50%;transform:translate(-50%,-100%);width:48px;height:3px;
  background:var(--accent);border-radius:0 0 2px 2px;cursor:pointer;z-index:60;transition:transform .2s}
.strip.on{transform:translate(-50%,0)}

/* 二级窗 3:4 */
.modal{position:fixed;inset:0;z-index:300;display:none;background:rgba(0,0,0,.18)}
.modal.on{display:block}
.dlg{position:absolute;width:420px;height:560px;background:var(--card);border:1px solid var(--card-border);
  border-radius:10px;box-shadow:0 24px 56px -12px rgba(10,20,40,.5);display:flex;flex-direction:column;
  overflow:hidden}
.dlg .dhead{display:flex;align-items:center;height:40px;padding:0 12px;flex:none;position:relative}
.dlg .backbtn{width:34px;height:40px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);cursor:pointer;border:none;background:transparent;margin-left:-12px}
.dlg .backbtn svg{width:14px;height:14px}
.dlg .backbtn:hover{background:var(--row-hover);color:var(--text)}
.dlg .dtitle{position:absolute;left:0;right:0;text-align:center;font-size:13px;font-weight:600;
  pointer-events:none}
.dlg .dbody{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 20px 0}
.dlg .state{display:flex;gap:12px;align-items:baseline;font-size:11px;color:var(--muted);
  padding:4px 0 10px;flex:none}
.dlg .state .badge.od{color:var(--overdue)}
.dlg textarea{flex:1;min-height:0;width:100%;resize:none;border:none;outline:none;background:transparent;
  color:var(--text);font-family:inherit;font-size:13px;line-height:1.8;padding:4px 0}
.dlg textarea::placeholder{color:var(--faint)}
.dlg .counter{flex:none;text-align:right;font-size:11px;color:var(--faint);padding:8px 0 0}
.dlg .counter.near{color:var(--overdue)}
.dlg .dview{flex:1;min-height:0;overflow:auto;font-size:13px;line-height:1.8;color:var(--text);
  padding:4px 0;white-space:pre-wrap;word-break:break-word}
.dlg .detailrows{flex:none;border-top:1px solid var(--card-border);padding:10px 0 4px}
.dlg .drow2{display:flex;gap:12px;padding:5px 0;font-size:12px}
.dlg .drow2 .k{flex:none;width:60px;color:var(--faint)}
.dlg .drow2 .v{color:var(--muted);font-variant-numeric:tabular-nums}
.dlg .dview{flex:1;min-height:0;overflow:auto;font-size:13px;line-height:1.8;color:var(--text);
  padding:4px 0;white-space:pre-wrap;word-break:break-word}
.dlg .detailrows{flex:none;border-top:1px solid var(--card-border);padding:10px 0 4px}
.dlg .drow2{display:flex;gap:12px;padding:5px 0;font-size:12px}
.dlg .drow2 .k{flex:none;width:60px;color:var(--faint)}
.dlg .drow2 .v{color:var(--muted);font-variant-numeric:tabular-nums}
.dlg .dactions{flex:none;display:flex;align-items:center;gap:8px;padding:12px 20px 16px}
.dlg .sp{margin-left:auto}
.btn{height:32px;padding:0 14px;border-radius:6px;border:1px solid var(--card-border);background:var(--card);
  color:var(--text);font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s,color .15s}
.btn:hover{background:var(--row-hover)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.primary:disabled{opacity:.45;cursor:default;background:var(--accent);transform:none}
.btn.sm{height:28px;font-size:11px;padding:0 10px}
.btn.danger{color:var(--overdue);border-color:rgba(168,58,52,.4)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--row-hover);color:var(--text)}

/* 确认框 */
.cmodal{position:fixed;inset:0;z-index:350;display:none;background:rgba(0,0,0,.28)}
.cmodal.on{display:flex;align-items:center;justify-content:center}
.cbox{width:340px;background:var(--card);border:1px solid var(--card-border);border-radius:10px;
  box-shadow:0 24px 56px -12px rgba(10,20,40,.5);padding:20px}
.cbox .t{font-size:13px;font-weight:600}
.cbox .b{margin-top:8px;font-size:12px;line-height:1.7;color:var(--muted);word-break:break-all}
.cbox .acts{margin-top:20px;display:flex;justify-content:flex-end;gap:8px}

/* toast */
.toasts{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:400;display:flex;
  flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:rgba(20,24,30,.94);color:#eef3fa;font-size:12px;padding:9px 14px;border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.35);animation:tin .18s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="pbar">
  <span class="b">1C 时间轴 · 可交互原型 v2</span>
  <span class="sep"></span>
  <button id="btnTheme">夜间</button>
  <button id="btnHour">24 小时制</button>
  <button id="btnTuck">收纳示意</button>
  <span class="sep"></span>
  <button id="btnReset">重置演示数据</button>
  <span class="hint">点 ＋ 新建 / 双击或悬停 ✎ 编辑 / 点方框完成 / ⚡ 模板窗 / 已完成点方框退回 / 拖点阵排序</span>
</div>

<div class="desk">
  <div class="anchor" id="anchor">
    <div class="cluster">
      <!-- 主窗 -->
      <div class="win main" id="mainWin">
        <div class="head">
          <span class="tb"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
          <span class="brand">桌面待办</span>
          <span class="wicons">
            <button class="ib" title="切换日/夜主题" id="btnMoon"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
            <button class="ib" title="置顶（原型示意）"><svg class="ic" viewBox="0 0 24 24"><path d="M12 17v5M9 3h6l1 7 3 3H5l3-3 1-7z"/></svg></button>
            <button class="ib" title="缩进锁定（原型示意）"><svg class="ic" viewBox="0 0 24 24"><path d="M3 4h18"/><rect x="7" y="11.5" width="10" height="8" rx="1.6"/><path d="M9.6 11.5V9a2.4 2.4 0 0 1 4.8 0v2.5"/></svg></button>
            <button class="ib" title="设置（后续批次）"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
            <button class="ib" title="收纳（整组上滑）" id="btnHide"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          </span>
        </div>

        <div class="clockzone">
          <span class="bigclock" id="clock">--:--</span>
          <span class="bigdate" id="date">--</span>
        </div>

        <!-- 动作一行四件：计数 → 删除 ‖ 新建 → 模板窗；全部水平对齐。
             批量态：本行整体让位给批量条（同一行几何，等高切换不跳动） -->
        <div class="actionzone" id="actionzone">
          <span class="cntchip" id="cnt">0/10</span>
          <button class="sidebtn" id="btnBatch" title="批量删除待办" aria-label="批量删除待办">
            <svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
          </button>
          <span class="spacer"></span>
          <button class="addbtn" id="btnAdd" title="新建待办" aria-label="新建待办"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          <button class="sidebtn" id="btnTpl" title="显示 / 隐藏模板窗（在右侧展开）" aria-label="模板窗">
            <svg class="ic" viewBox="0 0 24 24"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
          </button>
        </div>

        <div class="batchbar" id="batchbar">
          <span class="n" id="batchCount">已选 0 项</span>
          <button class="sbtn" id="batchExit">返回</button>
          <span class="sp"></span>
          <button class="sbtn" id="batchAll">全选</button>
          <button class="sbtn danger" id="batchDel" disabled>删除所选</button>
        </div>

        <div class="tl" id="tl"></div>
      </div>

      <!-- 模板窗 -->
      <div class="win tpl" id="tplWin">
        <div class="tplhead">
          <span class="brand">模板</span>
          <span class="cnt" id="tplCnt">0/10</span>
          <button class="ib" id="btnTplClose" title="收起模板窗" style="margin-left:4px">
            <svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="tplrows" id="tplRows"></div>
        <div class="tplfoot">
          <button class="ghost" id="btnTplNew">＋ 新建模板</button>
          <span class="sp"></span>
          <button class="ghost" id="btnTplBatch">批量删除</button>
        </div>
      </div>
    </div>
  </div>

  <div class="strip" id="strip" title="鼠标碰到细线，整组滑回"></div>
</div>

<div class="modal" id="modal"></div>
<div class="cmodal" id="cmodal"></div>
<div class="toasts" id="toasts"></div>

<script>
'use strict';
const CHECK = '<svg class="ic chk" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const GRIP = '<svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>';
const MAX_ITEMS = 10, MAX_TPL = 10, MAX_CHARS = 300;

const state = {
  theme: 'day', hour12: false,
  items: [], templates: [],
  tplOpen: false, tucked: false,
  batch: { on: false, sel: new Set() },
  tplBatch: { on: false, sel: new Set() },
  drag: null, flashId: null,
};

const pad = n => String(n).padStart(2, '0');
const nowDate = () => new Date();
const localKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayKey = () => localKey(nowDate());
function fmtClock(d) {
  if (!state.hour12) return pad(d.getHours()) + ':' + pad(d.getMinutes());
  const h24 = d.getHours(), h = h24 % 12 === 0 ? 12 : h24 % 12;
  return h + ':' + pad(d.getMinutes()) + ' ' + (h24 < 12 ? 'AM' : 'PM');
}
const fmtHM = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const fmtDate = d => (d.getMonth() + 1) + '月' + d.getDate() + '日 星期' + '日一二三四五六'[d.getDay()];
const uid = () => Math.random().toString(16).slice(2, 10);
const pendingOverdue = it => localKey(new Date(it.createdAt)) !== todayKey();
const doneOverdue = it => localKey(new Date(it.createdAt)) !== localKey(new Date(it.completedAt));
const pending = () => state.items.filter(i => !i.completedAt);
const completed = () => state.items.filter(i => i.completedAt).sort((a, b) => a.completedAt - b.completedAt);
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* ---------- 持久化 ---------- */
const KEY = 'proto-1c-state-v2';
function save() {
  localStorage.setItem(KEY, JSON.stringify({
    theme: state.theme, hour12: state.hour12,
    items: state.items, templates: state.templates, tplOpen: state.tplOpen
  }));
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    state.theme = d.theme === 'night' ? 'night' : 'day';
    state.hour12 = !!d.hour12;
    state.items = Array.isArray(d.items) ? d.items : [];
    state.templates = Array.isArray(d.templates) ? d.templates : [];
    state.tplOpen = !!d.tplOpen;
    return true;
  } catch (e) { return false; }
}
function seed() {
  const now = nowDate();
  const at = (h, m) => { const d = new Date(now); d.setHours(h, m, 0, 0); return +d; };
  const yest = (h, m) => { const d = new Date(now); d.setDate(d.getDate() - 1); d.setHours(h, m, 0, 0); return +d; };
  state.items = [
    { id: uid(), text: '写周报并发给部门同步', createdAt: yest(17, 20), completedAt: null },
    { id: uid(), text: '整理下季度 OKR 草稿，拆成可执行的关键结果', createdAt: at(9, 10), completedAt: null },
    { id: uid(), text: '买牛奶、鸡蛋和全麦面包', createdAt: at(9, 40), completedAt: null },
    { id: uid(), text: '每天站会前喝口水', createdAt: at(9, 45), completedAt: null },
    { id: uid(), text: '预约牙医复诊', createdAt: at(10, 5), completedAt: null },
    { id: uid(), text: '整理桌面文件归档', createdAt: at(9, 0), completedAt: at(11, 48) },
    { id: uid(), text: '回复合作方邮件', createdAt: at(9, 0), completedAt: at(13, 2) },
    { id: uid(), text: '午间饮水打卡', createdAt: at(9, 0), completedAt: at(13, 15) },
  ];
  state.templates = [
    { id: uid(), text: '每天站会前喝口水' },
    { id: uid(), text: '写周报' },
  ];
  state.tplOpen = false; state.theme = 'day'; state.hour12 = false;
}

/* ---------- toast / 确认 ---------- */
function toast(msg) {
  const host = document.getElementById('toasts');
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = msg;
  host.appendChild(d);
  setTimeout(() => d.remove(), 2200);
}
function confirmBox({ title, body, okText = '确定', danger = false, onOk }) {
  const host = document.getElementById('cmodal');
  host.innerHTML = '<div class="cbox"><div class="t">' + title + '</div>' +
    (body ? '<div class="b">' + body + '</div>' : '') +
    '<div class="acts"><button class="btn ghost" data-no>取消</button>' +
    '<button class="btn ' + (danger ? 'danger' : 'primary') + '" data-yes>' + okText + '</button></div></div>';
  host.classList.add('on');
  const yes = host.querySelector('[data-yes]');
  host.querySelector('[data-no]').onclick = () => host.classList.remove('on');
  yes.onclick = () => { host.classList.remove('on'); onOk && onOk(); };
  host.onclick = e => { if (e.target === host) host.classList.remove('on'); };
  yes.focus();
  host.onkeydown = e => { if (e.key === 'Escape') host.classList.remove('on'); };
}

/* ---------- 渲染 ---------- */
function renderClock() {
  const d = nowDate();
  document.getElementById('clock').textContent = fmtClock(d);
  document.getElementById('date').textContent = fmtDate(d);
}
function renderMain() {
  const tl = document.getElementById('tl');
  const p = pending(), dn = completed();
  let html = '';
  // 批量态与正常态共用一套行模板：批量=屏蔽交互——点阵禁用（不可拖）、
  // 行尾勾选框变为"选中"（不触发完成）；✎ 编辑按钮已移除，编辑只走双击。
  const inBatch = state.batch.on;
  for (const it of p) {
    const picked = inBatch && state.batch.sel.has(it.id);
    html += '<div class="trow' + (picked ? ' picked' : '') + (state.flashId === it.id ? ' flash' : '') +
      '" data-id="' + it.id + '" data-kind="p">' +
      '<span class="grip' + (inBatch ? ' disabled' : '') + '" title="' + (inBatch ? '批量中不可拖动' : '拖动排序') + '">' + GRIP + '</span>' +
      '<span class="tx" title="' + esc(it.text) + '">' + esc(it.text) + '</span>' +
      (pendingOverdue(it) ? '<span class="tag">逾期</span>' : '') +
      '<span class="cb' + (inBatch ? ' selecting' : '') + '" data-act="' + (inBatch ? 'select' : 'complete') +
      '" title="' + (inBatch ? (picked ? '取消选中' : '选中') : '完成') + '">' + CHECK + '</span>' +
      '</div>';
  }
  if (!p.length) {
    html += inBatch
      ? '<div class="empty"><div class="a">没有可批量删除的待办</div><div class="b">点「返回」退出批量</div></div>'
      : '<div class="empty"><div class="a">今天还没有待办</div><div class="b">点 ＋ 新建一条</div></div>';
  }
  html += '<div class="doneblock">';
  html += '<div class="sect"><span class="t">已完成 · ' + dn.length + '</span><span class="l"></span></div>';
  if (!dn.length) {
    html += '<div class="empty" style="padding:16px 0 4px"><div class="a" style="color:var(--faint)">今天还没有完成的事项</div></div>';
  }
  for (const it of dn) {
    html += '<div class="trow done' + (state.flashId === it.id ? ' flash' : '') + '" data-id="' + it.id + '" data-kind="d">' +
      '<span class="tt">' + fmtHM(new Date(it.completedAt)) + '</span>' +
      '<span class="node"><span class="dot solid"></span></span>' +
      '<span class="tx" title="' + esc(it.text) + '">' + esc(it.text) + '</span>' +
      (doneOverdue(it) ? '<span class="tag">逾期</span>' : '') +
      '<span class="cb done" data-act="return" title="退回待办">' + CHECK + '</span>' +
      '</div>';
  }
  html += '</div>';
  tl.innerHTML = html;
  tl.classList.toggle('dimdone', state.batch.on);

  const cnt = document.getElementById('cnt');
  cnt.textContent = p.length + '/' + MAX_ITEMS;
  cnt.classList.toggle('full', p.length >= MAX_ITEMS);

  document.getElementById('batchbar').classList.toggle('on', state.batch.on);
  document.getElementById('actionzone').style.display = state.batch.on ? 'none' : 'flex';
  document.getElementById('batchCount').textContent = '已选 ' + state.batch.sel.size + ' 项';
  document.getElementById('batchDel').disabled = state.batch.sel.size === 0;
  document.getElementById('batchAll').textContent =
    state.batch.sel.size === p.length && p.length > 0 ? '取消全选' : '全选';
  document.getElementById('btnBatch').classList.toggle('on', state.batch.on);
  state.flashId = null;
}
function renderTpl() {
  const win = document.getElementById('tplWin');
  win.classList.toggle('open', state.tplOpen);
  const tplBtn = document.getElementById('btnTpl');
  tplBtn.classList.toggle('on', state.tplOpen);
  document.getElementById('tplCnt').textContent = state.templates.length + '/' + MAX_TPL;

  const rows = document.getElementById('tplRows');
  let html = '';
  if (!state.templates.length) {
    html = '<div class="empty"><div class="a">还没有模板</div><div class="b">点下面 ＋ 新建模板</div></div>';
  }
  for (const t of state.templates) {
    const picked = state.tplBatch.sel.has(t.id);
    html += '<div class="tplrow' + (picked ? ' picked' : '') + '" data-tid="' + t.id + '">' +
      (state.tplBatch.on ? '<span class="sel">' + CHECK + '</span>' : '') +
      '<span class="tx" title="' + esc(t.text) + '">' + esc(t.text) + '</span>' +
      (state.tplBatch.on ? '' : '<button class="plus" data-act="apply" title="加入今日待办">' +
        '<svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>') +
      '</div>';
  }
  rows.innerHTML = html;
  const tb = document.getElementById('btnTplBatch');
  tb.textContent = state.tplBatch.on
    ? (state.tplBatch.sel.size ? '删除所选 (' + state.tplBatch.sel.size + ')' : '退出批量')
    : '批量删除';
}
function renderAll() { renderClock(); renderMain(); renderTpl(); }

/* ---------- 二级窗 ---------- */
function openEditor({ mode, item, target }) {
  const host = document.getElementById('modal');
  const isTpl = target === 'tpl';
  const isEdit = mode === 'edit';
  const title = isTpl ? (isEdit ? '编辑模板' : '新建模板') : (isEdit ? '编辑待办' : '新建待办');
  const initText = item ? item.text : '';
  const created = item && !isTpl ? new Date(item.createdAt) : null;
  const od = item && !isTpl ? (item.completedAt ? doneOverdue(item) : pendingOverdue(item)) : false;

  host.innerHTML =
    '<div class="dlg">' +
      '<div class="dhead"><button class="backbtn" id="dBack" title="返回">' +
        '<svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>' +
        '<span class="dtitle">' + title + '</span></div>' +
      '<div class="dbody">' +
        (isEdit && !isTpl
          ? '<div class="state"><span class="badge' + (od ? ' od' : '') + '">' +
            (item.completedAt ? (od ? '已逾期' : '已完成') : (od ? '已逾期' : '进行中')) +
            '</span><span>创建于 ' + fmtDate(created) + ' ' + fmtHM(created) + '</span></div>'
          : '') +
        '<textarea id="dText" maxlength="300" placeholder="' +
          (isTpl ? '模板内容（≤300 字）' : '写点什么（≤300 字）') + '"></textarea>' +
        '<div class="counter" id="dCounter">0/300</div>' +
        '<div class="dactions">' +
          (isEdit ? '<button class="btn ghost sm" id="dRestore">还原</button>' : '<button class="btn ghost sm" id="dClear">清空</button>') +
          (isEdit && !isTpl ? '<button class="btn ghost sm" id="dToTpl">添加到模板</button>' : '') +
          (isEdit ? '<button class="btn sm danger" id="dDel">删除</button>' : '') +
          '<span class="sp"></span>' +
          '<button class="btn primary" id="dSave">' + (isEdit ? '保存' : (isTpl ? '新建模板' : '新建')) + '</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  host.classList.add('on');

  const ta = document.getElementById('dText');
  const counter = document.getElementById('dCounter');
  const saveBtn = document.getElementById('dSave');
  let dirty = false;

  function sync() {
    const len = ta.value.length;
    counter.textContent = len + '/' + MAX_CHARS;
    counter.classList.toggle('near', len > MAX_CHARS - 30);
    saveBtn.disabled = ta.value.trim().length === 0;
  }
  ta.value = initText; sync(); ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
  ta.oninput = () => { dirty = ta.value !== initText; sync(); };

  const mainRect = document.getElementById('mainWin').getBoundingClientRect();
  const dlg = host.querySelector('.dlg');
  dlg.style.left = Math.round(mainRect.left + (mainRect.width - 420) / 2) + 'px';
  dlg.style.top = Math.round(mainRect.top + (mainRect.height - 560) / 2) + 'px';

  const close = () => { host.classList.remove('on'); host.innerHTML = ''; };
  function back() {
    if (dirty && ta.value.trim() !== initText) {
      confirmBox({ title: '有未保存的修改', body: '返回将丢失刚才的修改。', okText: '放弃修改', onOk: close });
    } else close();
  }
  document.getElementById('dBack').onclick = back;
  host.onclick = e => { if (e.target === host) back(); };

  const clearBtn = document.getElementById('dClear');
  if (clearBtn) clearBtn.onclick = () => { ta.value = ''; dirty = true; sync(); ta.focus(); };
  const restoreBtn = document.getElementById('dRestore');
  if (restoreBtn) restoreBtn.onclick = () => { ta.value = initText; dirty = false; sync(); ta.focus(); };

  const toTpl = document.getElementById('dToTpl');
  if (toTpl) toTpl.onclick = () => {
    const text = ta.value.trim();
    if (!text) return toast('内容为空，先写点什么');
    if (state.templates.length >= MAX_TPL) return toast('模板已达上限（' + MAX_TPL + ' 条）');
    if (state.templates.some(t => t.text === text)) return toast('已存在相同内容');
    state.templates.push({ id: uid(), text });
    save(); renderTpl(); toast('已添加到模板');
  };

  const del = document.getElementById('dDel');
  if (del) del.onclick = () => {
    if (isTpl) {
      confirmBox({ title: '删除这个模板？', body: esc(item.text), okText: '删除', danger: true,
        onOk: () => { state.templates = state.templates.filter(t => t.id !== item.id); save(); renderTpl(); close(); toast('已删除模板'); } });
    } else {
      confirmBox({ title: '删除这条待办？', body: esc(item.text), okText: '删除', danger: true,
        onOk: () => { state.items = state.items.filter(i => i.id !== item.id); save(); renderAll(); close(); toast('已删除'); } });
    }
  };

  function submit() {
    const text = ta.value.trim();
    if (!text) return;
    if (isTpl) {
      if (state.templates.some(t => t.text === text && (!item || t.id !== item.id))) return toast('已存在相同内容');
      if (isEdit) {
        const t = state.templates.find(t => t.id === item.id);
        if (t) t.text = text;
        save(); renderTpl(); close(); toast('模板已保存');
      } else {
        if (state.templates.length >= MAX_TPL) return toast('模板已达上限（' + MAX_TPL + ' 条）');
        state.templates.push({ id: uid(), text });
        save(); renderTpl(); close(); toast('模板已新建');
      }
      return;
    }
    if (isEdit) {
      const it = state.items.find(i => i.id === item.id);
      if (it) it.text = text;
      save(); renderAll(); close(); toast('已保存');
    } else {
      if (!canAdd()) return toast('已达上限（' + MAX_ITEMS + ' 条），先完成或删除一条');
      state.items.push({ id: uid(), text, createdAt: +nowDate(), completedAt: null });
      save(); renderAll(); close(); toast('已新建');
    }
  }
  saveBtn.onclick = submit;
  ta.onkeydown = e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
    if (e.key === 'Escape') { e.preventDefault(); back(); }
  };
}
const canAdd = () => pending().length < MAX_ITEMS;

/* ---------- 主窗事件 ---------- */
document.getElementById('tl').addEventListener('click', e => {
  const row = e.target.closest('.trow');
  if (!row) return;
  const id = row.dataset.id, kind = row.dataset.kind;
  const it = state.items.find(i => i.id === id);
  if (!it) return;
  const act = e.target.closest('[data-act]');
  if (state.batch.on) {
    if (kind !== 'p') return;
    if (state.batch.sel.has(id)) state.batch.sel.delete(id); else state.batch.sel.add(id);
    renderMain();
    return;
  }
  if (act && act.dataset.act === 'complete') {
    it.completedAt = +nowDate();
    state.flashId = it.id;
    save(); renderAll(); toast('已完成');
    return;
  }
  if (act && act.dataset.act === 'return') {
    it.completedAt = null;
    state.flashId = it.id;
    save(); renderAll(); toast('已退回待办');
  }
});
document.getElementById('tl').addEventListener('dblclick', e => {
  const row = e.target.closest('.trow');
  if (!row || state.batch.on) return;
  const it = state.items.find(i => i.id === row.dataset.id);
  if (!it) return;
  if (it.completedAt) return openDetail(it);   // 已完成=只读详情
  openEditor({ mode: 'edit', item: it, target: 'todo' });
});

// 只读详情（已完成）：内容 / 创建时间 / 完成时间，均不可编辑；可退回
function openDetail(it) {
  const host = document.getElementById('modal');
  const created = new Date(it.createdAt), doneAt = new Date(it.completedAt);
  const od = doneOverdue(it);
  host.innerHTML =
    '<div class="dlg">' +
      '<div class="dhead"><button class="backbtn" id="dBack" title="返回">' +
        '<svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>' +
        '<span class="dtitle">详情</span></div>' +
      '<div class="dbody">' +
        '<div class="state"><span class="badge' + (od ? ' od' : '') + '">' + (od ? '已逾期' : '已完成') +
        '</span><span>创建于 ' + fmtDate(created) + ' ' + fmtHM(created) + '</span></div>' +
        '<div class="dview">' + esc(it.text) + '</div>' +
        '<div class="detailrows">' +
          '<div class="drow2"><span class="k">创建时间</span><span class="v">' + fmtDate(created) + ' ' + fmtHM(created) + '</span></div>' +
          '<div class="drow2"><span class="k">完成时间</span><span class="v">' + fmtDate(doneAt) + ' ' + fmtHM(doneAt) + '</span></div>' +
        '</div>' +
        '<div class="dactions"><span class="sp"></span>' +
          '<button class="btn" id="dReturn">退回待办</button>' +
          '<button class="btn primary" id="dClose">关闭</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  host.classList.add('on');
  const mainRect = document.getElementById('mainWin').getBoundingClientRect();
  const dlg = host.querySelector('.dlg');
  dlg.style.left = Math.round(mainRect.left + (mainRect.width - 420) / 2) + 'px';
  dlg.style.top = Math.round(mainRect.top + (mainRect.height - 560) / 2) + 'px';
  const close = () => { host.classList.remove('on'); host.innerHTML = ''; };
  document.getElementById('dBack').onclick = close;
  document.getElementById('dClose').onclick = close;
  document.getElementById('dReturn').onclick = () => {
    it.completedAt = null; save(); renderAll(); close(); toast('已退回待办');
  };
  host.onclick = e => { if (e.target === host) close(); };
}

document.getElementById('btnAdd').onclick = () => {
  if (!canAdd()) return toast('已达上限（' + MAX_ITEMS + ' 条），先完成或删除一条');
  openEditor({ mode: 'new', target: 'todo' });
};
document.getElementById('btnBatch').onclick = () => {
  if (state.batch.on) { state.batch.on = false; state.batch.sel.clear(); }
  else {
    if (!pending().length) return toast('没有可批量删除的待办');
    state.batch.on = true; state.batch.sel.clear();
    state.tplBatch.on = false; state.tplBatch.sel.clear();
  }
  renderAll();
};
document.getElementById('batchAll').onclick = () => {
  const p = pending();
  if (state.batch.sel.size === p.length) state.batch.sel.clear();
  else p.forEach(i => state.batch.sel.add(i.id));
  renderMain();
};
document.getElementById('batchExit').onclick = () => { state.batch.on = false; state.batch.sel.clear(); renderAll(); };
document.getElementById('batchDel').onclick = () => {
  const n = state.batch.sel.size;
  if (!n) return;
  confirmBox({
    title: '删除所选 ' + n + ' 条待办？', body: '删除后不可恢复（演示数据可重置）。', okText: '删除', danger: true,
    onOk: () => {
      state.items = state.items.filter(i => !state.batch.sel.has(i.id));
      state.batch.on = false; state.batch.sel.clear();
      save(); renderAll(); toast('已删除 ' + n + ' 条');
    }
  });
};

/* ---------- 模板窗事件 ---------- */
document.getElementById('btnTpl').onclick = () => { state.tplOpen = !state.tplOpen; save(); renderTpl(); };
document.getElementById('btnTplClose').onclick = () => { state.tplOpen = false; save(); renderTpl(); };
document.getElementById('btnTplNew').onclick = () => {
  if (state.templates.length >= MAX_TPL) return toast('模板已达上限（' + MAX_TPL + ' 条）');
  openEditor({ mode: 'new', target: 'tpl' });
};
document.getElementById('tplRows').addEventListener('click', e => {
  const row = e.target.closest('.tplrow');
  if (!row) return;
  const t = state.templates.find(x => x.id === row.dataset.tid);
  if (!t) return;
  if (state.tplBatch.on) {
    if (state.tplBatch.sel.has(t.id)) state.tplBatch.sel.delete(t.id); else state.tplBatch.sel.add(t.id);
    renderTpl();
    return;
  }
  const act = e.target.closest('[data-act]');
  if (act && act.dataset.act === 'apply') {
    if (!canAdd()) return toast('待办已达上限（' + MAX_ITEMS + ' 条）');
    state.items.push({ id: uid(), text: t.text, createdAt: +nowDate(), completedAt: null });
    save(); renderAll(); toast('已加入今日待办');
  }
});
document.getElementById('tplRows').addEventListener('dblclick', e => {
  const row = e.target.closest('.tplrow');
  if (!row || state.tplBatch.on) return;
  const t = state.templates.find(x => x.id === row.dataset.tid);
  if (t) openEditor({ mode: 'edit', item: t, target: 'tpl' });
});
document.getElementById('btnTplBatch').onclick = () => {
  if (!state.templates.length) return toast('还没有模板');
  if (!state.tplBatch.on) { state.tplBatch.on = true; state.tplBatch.sel.clear(); renderTpl(); return; }
  const n = state.tplBatch.sel.size;
  if (!n) { state.tplBatch.on = false; renderTpl(); return; }
  confirmBox({
    title: '删除所选 ' + n + ' 个模板？', body: '模板删除后不可恢复。', okText: '删除', danger: true,
    onOk: () => {
      state.templates = state.templates.filter(t => !state.tplBatch.sel.has(t.id));
      state.tplBatch.on = false; state.tplBatch.sel.clear();
      save(); renderTpl(); toast('已删除 ' + n + ' 个模板');
    }
  });
};

/* ---------- 主题 / 12-24 / 收纳 ---------- */
function applyTheme() {
  document.body.dataset.theme = state.theme;
  document.getElementById('btnTheme').textContent = state.theme === 'day' ? '夜间' : '白天';
  document.getElementById('btnMoon').classList.toggle('on', state.theme === 'night');
}
document.getElementById('btnTheme').onclick = () => {
  state.theme = state.theme === 'day' ? 'night' : 'day'; applyTheme(); save();
};
document.getElementById('btnMoon').onclick = () => document.getElementById('btnTheme').click();
document.getElementById('btnHour').onclick = function () {
  state.hour12 = !state.hour12;
  this.textContent = state.hour12 ? '12 小时制' : '24 小时制';
  renderClock(); save();
};
function tuck(on) {
  state.tucked = on;
  document.getElementById('anchor').classList.toggle('tucked', on);
  const strip = document.getElementById('strip');
  if (on) setTimeout(() => strip.classList.add('on'), 260);
  else strip.classList.remove('on');
}
document.getElementById('btnTuck').onclick = () => tuck(!state.tucked);
document.getElementById('btnHide').onclick = () => tuck(true);
document.getElementById('strip').onmouseenter = () => tuck(false);

/* ---------- 拖动排序 ---------- */
document.getElementById('tl').addEventListener('mousedown', e => {
  const grip = e.target.closest('.grip');
  if (!grip || state.batch.on) return;
  const row = grip.closest('.trow');
  if (!row) return;
  const from = pending().findIndex(i => i.id === row.dataset.id);
  if (from < 0) return;
  state.drag = { from, to: from };
  row.classList.add('dragging');
  const onMove = ev => {
    const rows = Array.from(document.querySelectorAll('#tl .trow[data-kind="p"]'));
    let idx = rows.findIndex(r => {
      const b = r.getBoundingClientRect();
      return ev.clientY < b.top + b.height / 2;
    });
    if (idx < 0) idx = rows.length - 1;
    state.drag.to = idx;
  };
  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    row.classList.remove('dragging');
    const drag = state.drag; state.drag = null;
    if (drag && drag.to !== drag.from) {
      const arr = pending().slice();
      const item = arr.splice(drag.from, 1)[0];
      arr.splice(Math.max(0, Math.min(drag.to, arr.length)), 0, item);
      const comp = state.items.filter(i => i.completedAt).sort((a, b) => a.completedAt - b.completedAt);
      state.items = arr.concat(comp);
      save(); renderMain();
    }
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});

/* ---------- 启动 ---------- */
if (!load()) { seed(); save(); }
applyTheme();
document.getElementById('btnHour').textContent = state.hour12 ? '12 小时制' : '24 小时制';
renderAll();
setInterval(renderClock, 1000);
document.getElementById('btnReset').onclick = () => confirmBox({
  title: '重置演示数据？', body: '会清掉你在这里新建的所有待办与模板。', okText: '重置', danger: true,
  onOk: () => {
    seed(); save();
    state.batch.on = false; state.batch.sel.clear();
    state.tplBatch.on = false; state.tplBatch.sel.clear();
    tuck(false); applyTheme(); renderAll();
    document.getElementById('btnHour').textContent = '24 小时制';
    toast('已重置');
  }
});
window.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('modal').classList.contains('on')) return;
  if (document.getElementById('cmodal').classList.contains('on')) return;
  if (state.batch.on) { state.batch.on = false; state.batch.sel.clear(); renderAll(); return; }
  if (state.tplBatch.on) { state.tplBatch.on = false; state.tplBatch.sel.clear(); renderTpl(); }
});
</script>
</body>
</html>
